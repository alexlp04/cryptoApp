name: Auditoría de dependencias

# Lo que el CI principal NO cubre.
#
# Lo que el CI principal NO cubre: avisos de seguridad en las dependencias. Java se consulta en OSV
# (api.osv.dev, sin clave ni bases de datos que descargar; el escáner OWASP se quitó porque la
# descarga del NVD no terminaba) y Python con pip-audit sobre requirements.txt.
#
# Una API externa intermitente no debe tumbar la validación de un cambio de código, así que
# corre en su propio workflow: semanal, manual bajo demanda, y sin bloquear a nadie.

on:
  schedule:
    # Lunes a las 06:00 UTC. Semanal basta: los CVE nuevos no aparecen por hora.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Dependencias Java (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Las dependencias de runtime (transitivas incluidas) que resuelve Maven de verdad.
      - name: Listar dependencias
        working-directory: code/backendBotTrading
        run: mvn -B --no-transfer-progress dependency:list -DincludeScope=runtime -DoutputFile=${{ runner.temp }}/deps.txt

      # OSV no necesita clave ni descargar bases de datos. Los avisos aceptados, con su motivo, están
      # en .github/osv-ignore.txt; cualquier otro hace fallar el job (este workflow no bloquea PRs).
      - name: Consultar OSV
        run: python .github/scripts/osv_audit.py < "${{ runner.temp }}/deps.txt"

  python:
    name: Dependencias Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pip-audit
        run: "pip install --only-binary=:all: pip-audit==2.10.1"  # entre comillas: ':all: ' rompe el YAML

      # Se audita requirements.txt directamente en lugar del entorno instalado: es la
      # lista que declara el proyecto y evita instalar TensorFlow solo para escanear.
      # continue-on-error porque este workflow informa, no bloquea; el resultado queda
      # en el resumen del run y en el artefacto.
      - name: pip-audit
        id: audit
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --format json --output pip-audit.json

      - name: Resumen legible
        if: always()
        run: pip-audit --requirement requirements.txt --desc || true

      - name: Publicar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 30
