; Configuración de mypy para CryptoApp.
;
; Sin este fichero mypy reporta ~87 errores de los que 75 no son del código:
;   - 28 "import-not-found": los engines se importan entre sí por nombre plano
;     (import shared_utils), porque Java los lanza con code/scripts como cwd.
;     mypy_path replica ese layout.
;   - 47 "import-untyped": el stack científico (pandas, sklearn, tensorflow…) no
;     publica stubs. Se silencian por módulo, uno a uno, en lugar de globalmente,
;     para que un import roto de nuestro propio código siga siendo un error.

[mypy]
python_version = 3.11
mypy_path = code/scripts, code
namespace_packages = True
explicit_package_bases = True
; Si un "type: ignore" deja de hacer falta, avisa en vez de acumular ruido.
warn_unused_ignores = True
warn_redundant_casts = True

; ── Stack científico sin stubs publicados ────────────────────────────────────

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-keras.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-lightgbm.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-optuna.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-msgpack.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True
