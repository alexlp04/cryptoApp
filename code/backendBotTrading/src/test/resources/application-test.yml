spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Los tests unitarios generan el esquema desde las entidades JPA: son rápidos y no
  # dependen de MySQL. La correspondencia entre entidades y las migraciones reales se
  # verifica aparte, en el perfil 'schema' (application-schema.yml).
  flyway:
    enabled: false
