# Perfil de integración contra MySQL 8 real.
#
# Valida lo que H2 no puede: tipos MySQL (BIT(1), DATETIME(6), DECIMAL), semántica de
# AUTO_INCREMENT y las claves foráneas tal y como se comportan en producción.
#
# Requiere una base vacía dedicada, NUNCA la de trabajo:
#   CREATE DATABASE bottradingdb_test;
#
# Credenciales por entorno para no versionarlas:
#   set TEST_DB_USER=...  &  set TEST_DB_PASSWORD=...
#
# Ejecutar:
#   mvn test "-Dtest=SchemaMigrationValidationTest" "-Dspring.profiles.active=integration"
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/bottradingdb_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${TEST_DB_USER:root}
    password: ${TEST_DB_PASSWORD:}

  jpa:
    hibernate:
      # Igual que producción: el esquema lo crea Flyway, Hibernate solo comprueba.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Permite que el test limpie la base entre ejecuciones. Seguro solo porque este
    # perfil apunta a una base de test dedicada.
    clean-disabled: false
