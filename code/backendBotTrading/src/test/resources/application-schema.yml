# Perfil de verificación de esquema.
#
# Ejecuta las migraciones de Flyway y pone a Hibernate en 'validate': si una entidad
# JPA y la migración divergen, el contexto no arranca y el test falla. Es la red que
# faltaba, porque los tests unitarios generan el esquema desde las propias entidades
# y por construcción nunca pueden detectar esa divergencia.
#
# Usa H2 en modo de compatibilidad MySQL para no exigir un servidor. Para validar
# contra MySQL 8 real, ver application-integration.yml.
spring:
  datasource:
    url: jdbc:h2:mem:schemadb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
