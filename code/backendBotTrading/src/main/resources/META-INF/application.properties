# 1. Configuración de Base de Datos (Ya la tienes con el .env y el Main)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo versiona Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades cuadren con lo que hay en la base:
# 'update' mutaba el esquema en silencio y nunca aplicaba ALTER ni DROP correctamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# Flyway. baseline-on-migrate permite adoptar una base ya existente (creada en su día
# por ddl-auto=update) sin tener que recrearla desde cero.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Dialecto actualizado para Spring Boot 3.x y MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL de Hibernate desactivado para reducir ruido por defecto
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 4. Forzar inicialización
spring.sql.init.mode=always

# 1. Apagar el Banner gigante de SPRING
spring.main.banner-mode=off

# 2. Apagar los logs de arranque ("Starting AppBot...", "Tomcat started...")
spring.main.log-startup-info=false
