# 1. Configuración de Base de Datos (Ya la tienes con el .env y el Main)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fuente de verdad de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# Dialecto actualizado para Spring Boot 3.x y MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL de Hibernate desactivado para reducir ruido por defecto
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 4. Forzar inicialización
spring.sql.init.mode=always

# 1. Apagar el Banner gigante de SPRING
spring.main.banner-mode=off

# 2. Apagar los logs de arranque ("Starting AppBot...", "Tomcat started...")
spring.main.log-startup-info=false
