# NO MOVER ESTE FICHERO. Debe estar en la raíz de src/main/resources: Spring Boot solo
# busca en classpath:/, classpath:/config/, ./ y ./config/. Estuvo en META-INF/, que no es
# ninguna de ellas, y durante ese tiempo NADA de lo de aquí se aplicó en producción
# (ni ddl-auto=validate ni baseline-on-migrate). No se notó porque el banner y los logs
# de arranque, los dos efectos visibles, los fija además BotApplication por código.

# 1. Base de datos. Las credenciales salen de ./.env (spring.config.import, formato .properties:
# KEY=valor SIN comillas, y una barra invertida es carácter de escape) o de variables de entorno
# reales (Docker), con la misma precedencia que cualquier propiedad de Spring.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo versiona Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades cuadren con lo que hay en la base:
# 'update' mutaba el esquema en silencio y nunca aplicaba ALTER ni DROP correctamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# Flyway. baseline-on-migrate permite adoptar una base ya existente (creada en su día
# por ddl-auto=update) sin tener que recrearla desde cero.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Dialecto actualizado para Spring Boot 3.x y MySQL 8.
# Solo 'database-platform': 'spring.jpa.properties.hibernate.dialect' llega directo a
# Hibernate y ganaba a los perfiles de test, que conmutan a H2 vía database-platform.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL de Hibernate desactivado para reducir ruido por defecto
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 4. Forzar inicialización
spring.sql.init.mode=always

# 1. Apagar el Banner gigante de SPRING
spring.main.banner-mode=off

# 2. Apagar los logs de arranque ("Starting AppBot...", "Tomcat started...")
spring.main.log-startup-info=false

logging.level.root=INFO

# 5. API REST de solo lectura (interfaces/api). Sin servidor web por defecto: la CLI y los tests no abren ningún puerto.
# Para habilitarla: SPRING_MAIN_WEBAPPLICATIONTYPE=servlet y CRYPTOAPP_API_TOKEN (32+ caracteres, obligatorio).
# Escucha solo en loopback; en Docker se cambia a 0.0.0.0 dentro del contenedor y el puerto se publica en 127.0.0.1.
spring.main.web-application-type=none
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
