# CryptoApp en una Raspberry Pi 5 (o cualquier equipo con Docker). Se lanza desde esta carpeta:
#   cp env-example .env && editar .env       (contraseñas)
#   mkdir -p secrets data/models data/results data/logs
#   cp ~/.config/cryptoapp/model.key secrets/model.key && chmod 600 secrets/model.key
#   openssl rand -hex 32 > secrets/api.token && chmod 600 secrets/api.token      (token de la API)
#   docker compose up -d --build
# Guía completa: deploy/README.md
name: cryptoapp

services:
  db:
    image: mysql:8.0            # multi-arquitectura (incluye linux/arm64)
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bottradingdb
      MYSQL_USER: ${DB_USER}                    # usuario propio de la app: solo tiene permisos sobre su base
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    # Memoria acotada para una Pi: el buffer pool por defecto reserva mucho más de lo que esta app necesita.
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=40", "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/bottradingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      # API REST de solo lectura (token en secrets/api.token). Escucha en todas las interfaces DEL CONTENEDOR; el puerto
      # solo se publica en 127.0.0.1 de la Pi: para verlo desde el móvil, VPN (ver README).
      SPRING_MAIN_WEBAPPLICATIONTYPE: servlet
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    secrets:
      - model_key
      - api_token
    # DOWN (503) si una estrategia ACTIVA se quedó sin proceso; Docker lo marca "unhealthy" (no reinicia por sí solo).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=4)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    volumes:
      - ./data/models:/app/models
      - ./data/results:/app/results
      - ./data/logs:/app/logs
    # Con terminal abierta la CLI queda disponible: `docker attach cryptoapp-app-1` (salir sin parar: Ctrl-P Ctrl-Q).
    # Si se quita, la app entra sola en modo servicio.
    stdin_open: true
    tty: true
    # Parar el contenedor pausa las estrategias activas y cierra los motores Python: dale tiempo.
    stop_grace_period: 60s

secrets:
  model_key:
    file: ./secrets/model.key
  api_token:
    file: ./secrets/api.token

volumes:
  dbdata:
